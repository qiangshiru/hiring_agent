services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; http.client.HTTPConnection('localhost', 8000).request('GET', '/health'); assert http.client.HTTPConnection('localhost', 8000).getresponse().status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hiring-network
    depends_on:
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_URL: http://api:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - hiring-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hiring-network

networks:
  hiring-network:
    driver: bridge

volumes:
  redis_data:
